<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billy's Public House · Agios Nikolaos</title>
    <link rel="icon" href="assets/billys-logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Yellowtail&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="site-header__nav" aria-label="Main">
        <!--HEADER BUTTON-->
        <button
          class="site-header__toggle"
          type="button"
          aria-label="Menu"
          popovertarget="site-menu"
        >
          <span class="site-header__toggle-line"></span>
          <span class="site-header__toggle-line"></span>
          <span class="site-header__toggle-line"></span>
        </button>
        <a
          href="#top"
          class="site-header__logo-link"
          aria-label="Billy's Public House, home"
        >
          <img
            class="site-header__logo-img"
            src="./assets/billys-logo.svg"
            alt="Billy's Public House"
            width="48"
            height="48"
          />
        </a>

        <ul class="site-header__menu" id="site-menu" popover>
          <li class="site-header__item">
            <a class="site-header__link" href="#tables">Tables</a>
          </li>
          <li class="site-header__item">
            <a class="site-header__link" href="#games">Games</a>
          </li>
          <li class="site-header__item">
            <a class="site-header__link" href="#sports">Sports</a>
          </li>
          <li class="site-header__item">
            <a class="site-header__link" href="#bar">Bar</a>
          </li>
          <li class="site-header__item">
            <a class="site-header__link" href="#find">Find us</a>
          </li>
        </ul>

        <div class="site-header__lang">
          <a class="site-header__lang-link" href="#" lang="el" hreflang="el"
            >el
          </a>
          <span class="site-header__slash" aria-hidden="true">/</span>
          <a
            class="site-header__lang-link"
            href="index.html"
            lang="en"
            hreflang="en"
            aria-current="true"
            >en</a
          >
        </div>
      </nav>
    </header>
    <main>
      <section class="hero">
        <!-- HERO IMAGE -->

        <img
          class="hero__img"
          src="assets/photos/hero-billiards.webp"
          alt="In a dark room, a hand lines up a cue behind the cue ball on red felt, the racked balls waiting at the far end of the table"
          width="4284"
          height="3319"
          fetchpriority="high"
        />

        <!-- HERO TITLE, SUB TEXT -->
        <div class="hero__content">
          <!-- AGIOS NIKOLAOS, EST. 1987 -->
          <div class="hero__sub-text">
            <!-- <p class="hero__sub-item">Agios Nikolaos, Crete</p>
            <p class="hero__sub-item">est. <time datetime="1987">1987</time></p>-->
          </div>

          <!-- BILLY'S PUBLIC HOUSE -->
          <h1 class="hero__heading">
            <span class="hero__title"
              >Billy<span class="hero__apostrophe">&rsquo;</span>s</span
            >
            <span class="hero__sub-title"
              >Public <span class="hero__tagline-accent">House</span></span
            >
          </h1>

          <!-- HERO PARAGRAPH, BUTTONS -->
          <div class="hero__bottom">
            <p class="hero__paragraph">
              Pool, darts, pinball and PlayStation, cold beer and the match on
              every screen. The old pool hall of the town.
            </p>

            <!-- GET DIRECTIONS, CALL THE BAR -->
            <div class="hero__links">
              <a
                class="button button--main"
                href="https://maps.app.goo.gl/GQYf6XqLFFtqe7Yu7"
                target="_blank"
                rel="noopener"
                aria-label="Get Directions (opens in a new tab)"
                >Get Directions</a
              >
              <a class="button button--secondary" href="tel:+306970240215"
                >Call the bar</a
              >
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
